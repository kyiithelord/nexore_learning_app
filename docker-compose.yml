services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: nexora, POSTGRES_USER: nexora, POSTGRES_PASSWORD: nexora}
    volumes: [postgres_data:/var/lib/postgresql/data]
  storage:
    image: chrislusf/seaweedfs:latest
    command: mini -dir=/data
    environment: {AWS_ACCESS_KEY_ID: nexora, AWS_SECRET_ACCESS_KEY: nexora-secret, S3_BUCKET: nexora-media}
    ports: ["9000:8333","9333:9333"]
    volumes: [storage_data:/data]
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://nexora:nexora@postgres:5432/nexora
      S3_ENDPOINT: http://storage:8333
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
    ports: ["3000:3000"]
    depends_on: [postgres,storage]
volumes: {postgres_data: {}, storage_data: {}}
